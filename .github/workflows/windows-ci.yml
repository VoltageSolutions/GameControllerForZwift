name: Windows CI

on:
  pull_request:
    paths:
      - 'windows/**'
      - '.github/workflows/windows-ci.yml'

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  APP_PROJECT: windows/src/Presentation/GameControllerForZwift/GameControllerForZwift.csproj
  # Non-WPF test projects (also built on Linux by the Lint job)
  PORTABLE_TESTS: >-
    windows/tests/GameControllerForZwift.Core.UnitTests
    windows/tests/GameControllerForZwift.Network.UnitTests
    windows/tests/GameControllerForZwift.Network.IntegrationTests
    windows/tests/GameControllerForZwift.Gamepad.UnitTests

jobs:
  build:
    name: Build
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: windows/global.json
          cache: true
          cache-dependency-path: 'windows/**/*.csproj'

      - name: Restore
        run: dotnet restore windows/GameControllerForZwift.sln

      - name: Build solution (Release)
        run: dotnet build windows/GameControllerForZwift.sln -c Release --no-restore

      - name: Publish (framework-dependent)
        run: dotnet publish $env:APP_PROJECT -c Release -r win-x64 --self-contained false -o artifacts/fd

      - name: Publish (standalone)
        run: dotnet publish $env:APP_PROJECT -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/standalone

      - name: Check publish output
        run: |
          ./.github/scripts/check-publish.ps1 -Path artifacts/fd -RequireSdl2
          ./.github/scripts/check-publish.ps1 -Path artifacts/standalone

      - name: Upload x64 build (framework-dependent)
        uses: actions/upload-artifact@v7
        with:
          name: app-win-x64
          path: artifacts/fd
          retention-days: 14
          if-no-files-found: error

      - name: Upload x64 build (standalone)
        uses: actions/upload-artifact@v7
        with:
          name: app-win-x64-standalone
          path: artifacts/standalone
          retention-days: 14
          if-no-files-found: error

      # Version Check: runs for pull requests into main and into release branches (release/vX.Y.Z).
      #   into main:      docs-only changes pass; otherwise the version must be higher than the latest release
      #                   tag, and a release/vX.Y.Z head branch must carry version X.Y.Z.
      #   into release/*: the version must match the base branch name (catches branches cut from an old release branch).
      - name: Evaluate version
        id: version
        if: github.base_ref == 'main' || startsWith(github.base_ref, 'release/')
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          vs=.github/scripts/version.sh
          props=windows/Directory.Build.props
          version="$(bash "$vs" get)" || { echo "::error title=Version Check::Could not read <Version> from $props"; exit 1; }
          git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          if git diff --name-only "origin/${BASE_REF}...HEAD" | grep -vqE '^docs/|^zensical\.toml$|\.md$'; then
            docs_only=false
          else
            docs_only=true
          fi
          conclusion=success
          if [ "$docs_only" = true ]; then
            title="Docs-only change: no new version needed"
            summary="This pull request only changes documentation, so the version is not checked."
          elif [ "$BASE_REF" = main ]; then
            latest="$(bash "$vs" latest-tag)"
            head_version=""
            if [[ "$HEAD_REF" == release/* ]]; then
              head_version="$(bash "$vs" from-branch "$HEAD_REF" 2>/dev/null)" || head_version=invalid
            fi
            if [ "$head_version" = invalid ]; then
              conclusion=failure; title="Branch ${HEAD_REF} is not named release/vX.Y.Z"
              summary="Release branches must be named release/vX.Y.Z so the version can be checked. Rename the branch and open the pull request again."
            elif [ -n "$head_version" ] && [ "$head_version" != "$version" ]; then
              conclusion=failure; title="Set <Version> in windows/Directory.Build.props to ${head_version}"
              summary="Branch ${HEAD_REF} is for version ${head_version}, but windows/Directory.Build.props has ${version}. Change <Version> in windows/Directory.Build.props to ${head_version}."
            elif [ -n "$latest" ] && ! bash "$vs" gt "$version" "$latest"; then
              conclusion=failure; title="Version ${version} is not higher than the latest release v${latest}: raise <Version> in windows/Directory.Build.props"
              summary="The latest release is v${latest}. Raise <Version> in windows/Directory.Build.props above ${latest} (the release branch name must match it)."
            else
              title="New app version v${version}"
              summary="Merging to main will create a new tag and release for v${version} (latest release: v${latest:-none})."
            fi
          else
            if ! base_version="$(bash "$vs" from-branch "$BASE_REF" 2>/dev/null)"; then
              conclusion=failure; title="Base branch ${BASE_REF} is not named release/vX.Y.Z"
              summary="Pull requests go into a release branch named release/vX.Y.Z. Point this pull request at the current release branch."
            elif [ "$base_version" != "$version" ]; then
              conclusion=failure; title="Set <Version> in windows/Directory.Build.props to ${base_version}"
              summary="This pull request goes into ${BASE_REF}, but windows/Directory.Build.props has ${version}. Your branch is probably based on an older release branch: merge or rebase it onto ${BASE_REF}, or change <Version> in windows/Directory.Build.props to ${base_version}."
            else
              title="Version ${version} matches ${BASE_REF}"
              summary="windows/Directory.Build.props has ${version}, the version of ${BASE_REF}."
            fi
          fi
          {
            echo "conclusion=$conclusion"
            echo "title=$title"
            echo "summary=$summary"
          } >> "$GITHUB_OUTPUT"
          echo "### Version Check: $conclusion" >> "$GITHUB_STEP_SUMMARY"
          echo "**$title**" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "$summary" >> "$GITHUB_STEP_SUMMARY"

      - name: Version Check
        if: (github.base_ref == 'main' || startsWith(github.base_ref, 'release/')) && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v9
        env:
          V_CONCLUSION: ${{ steps.version.outputs.conclusion }}
          V_TITLE: ${{ steps.version.outputs.title }}
          V_SUMMARY: ${{ steps.version.outputs.summary }}
        with:
          script: |
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'Version Check',
              head_sha: context.payload.pull_request.head.sha,
              status: 'completed',
              conclusion: process.env.V_CONCLUSION,
              output: { title: process.env.V_TITLE, summary: process.env.V_SUMMARY },
            });

      - name: Fail on version error
        if: steps.version.outputs.conclusion == 'failure'
        shell: bash
        env:
          V_TITLE: ${{ steps.version.outputs.title }}
        run: echo "::error title=Version Check failed::${V_TITLE}"; exit 1

  # Runs the x64 build on Windows 11 on ARM (x64 emulation). Not part of the coverage chain.
  arm-smoke:
    name: ARM smoke test
    runs-on: windows-11-arm
    needs: [build]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: app-win-x64-standalone
          path: artifacts/standalone

      - uses: actions/download-artifact@v8
        with:
          name: app-win-x64
          path: artifacts/fd

      # Primary check: the self-contained build needs no runtime, so this only tests the emulation itself.
      - name: Smoke test (standalone, x64 under emulation)
        shell: pwsh
        run: ./.github/scripts/smoke-test-app.ps1 -ExePath artifacts/standalone/GameControllerForZwift.exe -TimeoutSeconds 60 -Label standalone

      # The framework-dependent build needs the x64 .NET 10 runtimes, but the ARM runner only has arm64 .NET.
      # dotnet-install.ps1 with -Architecture x64 puts x64 Microsoft.NETCore.App and Microsoft.WindowsDesktop.App
      # into their own folder. An x64 apphost looks for DOTNET_ROOT_X64 first (it wins over DOTNET_ROOT and the
      # registry), so pointing that variable at the folder makes sure the x64 runtime is used, never the arm64 one.
      - name: Install x64 .NET 10 runtimes
        id: x64rt
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'dotnet-x64'
          $script = Join-Path $env:RUNNER_TEMP 'dotnet-install.ps1'
          Invoke-WebRequest -Uri https://dot.net/v1/dotnet-install.ps1 -OutFile $script
          & $script -Runtime dotnet -Channel 10.0 -Architecture x64 -InstallDir $dir
          & $script -Runtime windowsdesktop -Channel 10.0 -Architecture x64 -InstallDir $dir
          Get-ChildItem (Join-Path $dir 'shared') | ForEach-Object { Write-Host "$($_.Name): $((Get-ChildItem $_.FullName).Name -join ', ')" }
          "DOTNET_ROOT_X64=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Smoke test (framework-dependent, x64 under emulation)
        shell: pwsh
        run: ./.github/scripts/smoke-test-app.ps1 -ExePath artifacts/fd/GameControllerForZwift.exe -TimeoutSeconds 60 -Label framework-dependent

  tests:
    name: Run tests
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
      checks: write
      actions: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Enable Developer Mode
        run: reg add HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock /t REG_DWORD /f /v AllowDevelopmentWithoutDevLicense /d 1

      - name: Set runner resolution to modern device size
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: windows/global.json
          cache: true
          cache-dependency-path: 'windows/**/*.csproj'

      - name: Restore
        run: dotnet restore windows/GameControllerForZwift.sln

      - name: Build solution (Release)
        run: dotnet build windows/GameControllerForZwift.sln -c Release --no-restore

      # WinAppDriver is installed in its own foreground step (absolute paths, verbose msiexec log) so that a
      # failure stops the job with a clear message. appium-windows-driver >= 3 no longer bundles it.
      - name: Install WinAppDriver
        id: wad
        continue-on-error: true
        shell: pwsh
        run: |
          $candidates = @("${env:ProgramFiles(x86)}\Windows Application Driver\WinAppDriver.exe", "$env:ProgramFiles\Windows Application Driver\WinAppDriver.exe")
          $wad = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          "wad=failed" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          if ($wad) {
            Write-Host "WinAppDriver already installed at $wad"
          } else {
            $msi = Join-Path $env:RUNNER_TEMP 'WinAppDriver.msi'
            $log = Join-Path $env:RUNNER_TEMP 'winappdriver-install.log'
            Invoke-WebRequest -Uri https://github.com/microsoft/WinAppDriver/releases/download/v1.2.1/WindowsApplicationDriver_1.2.1.msi -OutFile $msi
            $p = Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /quiet /norestart /l*v `"$log`"" -Wait -PassThru
            $wad = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
            if ($p.ExitCode -notin 0, 3010 -and -not $wad) {
              Write-Host "--- last 60 lines of $log ---"
              if (Test-Path $log) { Get-Content $log -Tail 60 }
              throw "WinAppDriver installation failed: msiexec exit code $($p.ExitCode)"
            }
            if (-not $wad) { throw 'WinAppDriver.exe not found after install' }
            Write-Host "WinAppDriver installed at $wad (msiexec exit code $($p.ExitCode))"
          }
          "WINAPPDRIVER_PATH=$wad" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "wad=ok" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # The Appium install (slow, mostly network bound) runs as a PowerShell job INSIDE this step: the
      # runner kills background processes that outlive their step ("Cleaning up orphan processes").
      # continue-on-error so the UI tests still run and both reports are published; the final step fails the job.
      - name: Unit tests (UI toolchain installs in parallel)
        id: unit-run
        continue-on-error: true
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'ui-setup.log'
          Remove-Item $log -ErrorAction SilentlyContinue
          $job = Start-Job -ArgumentList $env:PATH, $PWD.Path, $log -ScriptBlock {
            param($path, $workDir, $log)
            Set-Location $workDir
            $env:PATH = $path
            $ErrorActionPreference = 'Stop'
            try {
              & {
                npm install -g appium@3.9.0
                if ($LASTEXITCODE -ne 0) { throw 'npm install appium failed' }
                appium driver install --source=npm appium-windows-driver@6.3.1
                if ($LASTEXITCODE -ne 0) { throw 'appium driver install failed' }
              } *>&1 | Out-File -FilePath $log -Encoding utf8
              'ok'
            } catch {
              "ERROR: $_" | Out-File -FilePath $log -Append -Encoding utf8
              'failed'
            }
          }

          $rc = 0
          $projects = @('windows/tests/GameControllerForZwift.UnitTests') + @(($env:PORTABLE_TESTS -split '\s+') | Where-Object { $_ })
          foreach ($p in $projects) {
            $name = Split-Path $p -Leaf
            # The string and accessibility checks report from Localization CI (localization-ci.yml).
            dotnet test $p -c Release --no-build --filter "Category!=Localization&Category!=Accessibility" --collect:"XPlat Code Coverage" --logger "trx;LogFileName=$name.trx" --results-directory "TestResults/$name"
            if ($LASTEXITCODE -ne 0) { $rc = 1 }
          }

          $status = 'failed'
          if (Wait-Job $job -Timeout 900) {
            $res = @(Receive-Job $job)
            if ($res.Count -gt 0 -and $res[-1] -eq 'ok') { $status = 'ok' }
          } else {
            Write-Host 'UI toolchain installation did not finish within 15 minutes.'
            Stop-Job $job
            Receive-Job $job -ErrorAction SilentlyContinue | Out-Null
          }
          Remove-Job $job -Force -ErrorAction SilentlyContinue
          Write-Host '--- UI toolchain install log ---'
          if (Test-Path $log) { Get-Content $log }
          "ui_toolchain=$status" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          exit $rc

      - name: UI tests
        id: ui-run
        continue-on-error: true
        shell: pwsh
        env:
          UI_TOOLCHAIN: ${{ steps.unit-run.outputs.ui_toolchain }}
          WAD_STATUS: ${{ steps.wad.outputs.wad }}
        run: |
          if ($env:WAD_STATUS -ne 'ok') { throw "UI toolchain (WinAppDriver) install failed (status: '$env:WAD_STATUS'); see the Install WinAppDriver step log." }
          if ($env:UI_TOOLCHAIN -ne 'ok') { throw "UI toolchain installation did not succeed (status: '$env:UI_TOOLCHAIN'); see the unit test step log." }
          $wad = $env:WINAPPDRIVER_PATH
          if (-not $wad -or -not (Test-Path $wad)) {
            $wad = @("${env:ProgramFiles(x86)}\Windows Application Driver\WinAppDriver.exe", "$env:ProgramFiles\Windows Application Driver\WinAppDriver.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $wad) { throw 'WinAppDriver.exe not found' }
          $env:APPIUM_WAD_PATH = $wad
          $appium = Start-Process cmd.exe -ArgumentList '/c', 'appium --allow-cors > appium.log 2>&1' -WindowStyle Hidden -PassThru
          $rc = 1
          try {
            $ready = $false
            $deadline = (Get-Date).AddSeconds(60)
            while (-not $ready -and (Get-Date) -lt $deadline) {
              try {
                $r = Invoke-WebRequest -Uri http://127.0.0.1:4723/status -UseBasicParsing -TimeoutSec 3
                if ($r.StatusCode -eq 200) { $ready = $true; Write-Host 'Appium is ready.' }
              } catch { Start-Sleep -Seconds 2 }
            }
            if (-not $ready) {
              Get-Content appium.log -ErrorAction SilentlyContinue
              throw 'Appium did not become ready within 60 seconds.'
            }
            dotnet test windows/tests/GameControllerForZwift.UITests -c Release --no-build --verbosity normal --logger "trx;LogFileName=UITests.trx" --results-directory TestResults-UI/UITests
            $rc = $LASTEXITCODE
          } finally {
            taskkill /T /F /PID $appium.Id 2>&1 | Out-Null
          }
          exit $rc

      # Test reports use EnricoMi/publish-unit-test-result-action instead of dorny/test-reporter: dorny creates a
      # check run and then updates it in a second API call, and since early Nov 2026 GitHub intermittently answers
      # that update with "HttpError: Not Found" (dorny/test-reporter#866, no retry in the action). EnricoMi creates the
      # completed check run in one call and retries API errors (github_retries). One step per report publishes the PR
      # check run (named as before; needs checks: write, which fork PRs lack, so check_run is off for them) and the
      # job summary; the json output feeds the skipped-test gate below.
      - name: Unit Test Results
        id: report-unit
        if: ${{ !cancelled() }}
        uses: EnricoMi/publish-unit-test-result-action/windows@v2
        with:
          check_name: Unit Test Results
          trx_files: TestResults/**/*.trx
          comment_mode: 'off'
          check_run: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          job_summary: 'true'
          github_retries: '10'

      - name: UI Test Results
        id: report-ui
        if: ${{ !cancelled() }}
        uses: EnricoMi/publish-unit-test-result-action/windows@v2
        with:
          check_name: UI Test Results
          trx_files: TestResults-UI/**/*.trx
          comment_mode: 'off'
          check_run: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          job_summary: 'true'
          github_retries: '10'

      # Check runs report failures themselves; skipped tests do not fail a check run, so the final step
      # evaluates the skipped counts from the reporters' json output.
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            TestResults/**/*.trx
            TestResults-UI/**/*.trx
          if-no-files-found: warn

      - name: Upload coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-unit
          path: |
            TestResults/**/coverage.cobertura.xml
            !TestResults/**/In/**
          if-no-files-found: warn

      - name: Upload UI diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ui-diagnostics
          path: |
            appium.log
            windows/tests/GameControllerForZwift.UITests/**/screenshot.png
          if-no-files-found: warn

      - name: Fail if any test failed or was skipped
        if: ${{ !cancelled() }}
        shell: bash
        env:
          UNIT_OUTCOME: ${{ steps.unit-run.outcome }}
          UI_OUTCOME: ${{ steps.ui-run.outcome }}
          TOOLCHAIN: ${{ steps.unit-run.outputs.ui_toolchain }}
          WAD: ${{ steps.wad.outputs.wad }}
          UNIT_SKIPPED: ${{ fromJSON(steps.report-unit.outputs.json || '{}').stats.tests_skip }}
          UI_SKIPPED: ${{ fromJSON(steps.report-ui.outputs.json || '{}').stats.tests_skip }}
        run: |
          fail=0
          if [ "$WAD" != ok ]; then echo "::error title=UI toolchain (WinAppDriver) install failed::UI toolchain (WinAppDriver) install failed (status: ${WAD:-none})."; fail=1; fi
          if [ "$TOOLCHAIN" != ok ]; then echo "::error title=UI toolchain (Appium) install failed::UI toolchain (Appium) install failed (status: ${TOOLCHAIN:-none})."; fail=1; fi
          if [ "$UNIT_OUTCOME" = failure ]; then echo "::error title=Unit tests failed::unit tests failed (unit/integration test step reported failure)."; fail=1; fi
          if [ "$UI_OUTCOME" = failure ]; then echo "::error title=UI tests failed::UI tests failed."; fail=1; fi
          if [ -n "$UNIT_SKIPPED" ] && [ "$UNIT_SKIPPED" != 0 ]; then echo "::error title=Skipped tests::skipped tests in unit tests: $UNIT_SKIPPED unit test(s) were skipped. Skipped tests are not allowed."; fail=1; fi
          if [ -n "$UI_SKIPPED" ] && [ "$UI_SKIPPED" != 0 ]; then echo "::error title=Skipped tests::skipped tests in UI tests: $UI_SKIPPED ui test(s) were skipped. Skipped tests are not allowed."; fail=1; fi
          exit $fail

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: windows/global.json
          cache: true
          cache-dependency-path: 'windows/**/*.csproj'

      - name: Restore
        run: |
          for p in $PORTABLE_TESTS windows/tools/ZwiftLanProbe; do dotnet restore "$p"; done

      - name: Verify formatting
        run: |
          for p in windows/src/Application/GameControllerForZwift.Core \
                   windows/src/Infrastructure/GameControllerForZwift.Network \
                   windows/src/Infrastructure/GameControllerForZwift.Gamepad \
                   $PORTABLE_TESTS windows/tools/ZwiftLanProbe; do
            dotnet format "$p" --verify-no-changes --severity error --no-restore --verbosity diagnostic
          done

      - name: Build portable projects (Linux)
        run: |
          for p in $PORTABLE_TESTS windows/tools/ZwiftLanProbe; do dotnet build "$p" -c Release --no-restore; done

  vulnerabilities:
    name: Vulnerabilities
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: windows/global.json
          cache: true
          cache-dependency-path: 'windows/**/*.csproj'

      - uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual
          config-file: ./.github/codeql/codeql-config.yml

      # Only the shipping projects are built inside the CodeQL window (the app pulls in Core/Gamepad/Network):
      # for compiled languages CodeQL analyzes what the build compiles, and paths-ignore is not applied to them.
      - name: Build shipping projects
        run: dotnet build $env:APP_PROJECT -c Release

      - uses: github/codeql-action/analyze@v4
        id: analyze
        with:
          category: '/language:csharp'
          output: sarif-results
          upload: never

      # WPF generates *.g.cs / *.g.i.cs files under obj/ that get compiled and analyzed. paths-ignore does not apply to
      # compiled languages, so alerts in generated files are removed from the SARIF before it is uploaded.
      - name: Filter generated files from SARIF
        uses: advanced-security/filter-sarif@v1
        with:
          patterns: |
            -**/*.g.cs
            -**/*.g.i.cs
            -**/obj/**
          input: sarif-results/csharp.sarif
          output: sarif-results/csharp.sarif

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: sarif-results/csharp.sarif
          category: '/language:csharp'

      - name: Check NuGet packages for known vulnerabilities
        shell: pwsh
        run: |
          dotnet restore windows/GameControllerForZwift.sln
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $json = dotnet list windows/GameControllerForZwift.sln package --vulnerable --include-transitive --format json --output-version 1 | Out-String
          if ($LASTEXITCODE -ne 0) { Write-Host $json; exit $LASTEXITCODE }
          $start = $json.IndexOf('{')
          $data = if ($start -ge 0) { $json.Substring($start) | ConvertFrom-Json } else { $null }
          $list = [System.Collections.Generic.List[object]]::new()
          if ($null -ne $data -and $null -ne $data.projects) {
            foreach ($proj in @($data.projects)) {
              if ($null -eq $proj.frameworks) { continue }
              foreach ($fw in @($proj.frameworks)) {
                $pkgs = @()
                if ($null -ne $fw.topLevelPackages) { $pkgs += @($fw.topLevelPackages) }
                if ($null -ne $fw.transitivePackages) { $pkgs += @($fw.transitivePackages) }
                foreach ($pkg in $pkgs) {
                  if ($null -eq $pkg.vulnerabilities) { continue }
                  foreach ($v in @($pkg.vulnerabilities)) {
                    $list.Add([pscustomobject]@{
                      Severity = $v.severity
                      Package  = $pkg.id
                      Version  = $pkg.resolvedVersion
                      Project  = Split-Path $proj.path -Leaf
                      Advisory = $v.advisoryurl
                    })
                  }
                }
              }
            }
          }
          $rows = @($list | Sort-Object Package, Project -Unique)
          "### NuGet vulnerabilities`n" >> $env:GITHUB_STEP_SUMMARY
          if ($rows.Count -eq 0) {
            'No vulnerable packages found.' >> $env:GITHUB_STEP_SUMMARY
            exit 0
          }
          "| Severity | Package | Version | Project | Advisory |`n|---|---|---|---|---|" >> $env:GITHUB_STEP_SUMMARY
          foreach ($r in $rows) { "| $($r.Severity) | $($r.Package) | $($r.Version) | $($r.Project) | $($r.Advisory) |" >> $env:GITHUB_STEP_SUMMARY }
          $blocking = @($rows | Where-Object { $_.Severity -in 'High', 'Critical' })
          foreach ($r in $rows) {
            $msg = "$($r.Severity): $($r.Package) $($r.Version) ($($r.Project)) $($r.Advisory)"
            if ($r.Severity -in 'High', 'Critical') { Write-Host "::error title=Vulnerable package::$msg" }
            else { Write-Host "::warning title=Vulnerable package::$msg" }
          }
          if ($blocking.Count -gt 0) { exit 1 }

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: [tests]
    if: ${{ always() && needs.tests.result != 'cancelled' }}
    timeout-minutes: 10
    steps:
      # Checkout gives Codecov the repository layout for path fixing.
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: coverage

      - name: Check coverage files exist
        shell: bash
        run: |
          if ! find coverage -name coverage.cobertura.xml 2>/dev/null | grep -q .; then
            echo "::error title=Coverage skipped::Coverage skipped: unit tests did not produce coverage — see Run tests"
            exit 1
          fi

      # Secrets are unavailable to fork PRs; for those, Codecov tokenless upload is used
      # (public repos, requires "Tokenless uploads" enabled in the Codecov org settings).
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/**/coverage.cobertura.xml
          fail_ci_if_error: true
