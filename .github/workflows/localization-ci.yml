name: Localization CI

# The string and accessibility ID checks read the specs, so they also run for changes under docs/spec.
on:
  pull_request:
    paths:
      - 'docs/spec/**'
      - 'windows/**'
      - '.github/workflows/localization-ci.yml'

concurrency:
  group: localization-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # The checks that keep the app's strings and accessibility IDs equal to the specs (UX-L-010 to UX-L-014, UX-A-018).
  # They run for every language the app ships and report as their own check, apart from the functional unit tests.
  localization:
    name: Localization and accessibility
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: windows/global.json
          cache: true
          cache-dependency-path: 'windows/**/*.csproj'

      - name: Restore
        run: dotnet restore windows/tests/GameControllerForZwift.UnitTests

      - name: Build
        run: dotnet build windows/tests/GameControllerForZwift.UnitTests -c Release --no-restore

      - name: Run the string and accessibility checks
        run: dotnet test windows/tests/GameControllerForZwift.UnitTests -c Release --no-build --filter "Category=Localization|Category=Accessibility" --logger "trx;LogFileName=Localization.trx" --results-directory TestResults-Localization

      - name: Localization and Accessibility Results
        if: ${{ !cancelled() }}
        uses: EnricoMi/publish-unit-test-result-action/windows@v2
        with:
          check_name: Localization and Accessibility Results
          trx_files: TestResults-Localization/**/*.trx
          comment_mode: 'off'
          check_run: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          job_summary: 'true'
          github_retries: '10'
