name: GameControllerForZwift CodeQL config
queries:
  - uses: security-and-quality
# The gamepad layer talks to SDL through native interop on purpose. There is no managed replacement
# with the same controller support, so the "use managed code" recommendations are excluded.
query-filters:
  - exclude:
      id:
        - cs/call-to-unmanaged-code
        - cs/unmanaged-code
# C# is a compiled language: CodeQL's `paths`/`paths-ignore` apply only to interpreted languages (Python, Ruby,
# JavaScript/TypeScript), see "Customizing your advanced setup for code scanning" in the GitHub docs. What gets
# analyzed is whatever the manual build in .github/workflows/windows-ci.yml and windows-codeql-and-coverage.yml compiles, and that build only compiles the
# shipping projects (windows/tests/ and windows/tools/ are not built there). The entries below are kept for documentation and for
# any non-compiled files CodeQL might pick up. Alerts in generated files (*.g.cs, obj/) are removed by a SARIF filter step in those workflows.
paths-ignore:
  - windows/tests/**
  - windows/tools/**
