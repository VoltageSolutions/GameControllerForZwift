version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      nuget-minor-patch:
        update-types: [minor, patch]
    ignore:
      # UI-test toolchain: majors need manual coordination with the Appium server/driver pinned in ci.yml
      - dependency-name: Appium.WebDriver
        update-types: ['version-update:semver-major']
      - dependency-name: Selenium.*
        update-types: ['version-update:semver-major']

  - package-ecosystem: pip
    directory: /docs
    schedule:
      interval: weekly
    groups:
      docs:
        patterns: ['*']
