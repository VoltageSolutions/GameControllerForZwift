coverage:
  # Set a minimum coverage threshold for PRs
  status:
    project:
      default:
        target: 40%
        threshold: 0%
    patch:
      default:
        target: 60%

  # Ignore specific files or directories
  ignore:
    - "**/Generated/*"
    - "**/Migrations/*"
    - "tests/**"
    - "tools/**"

comment: false
