coverage:
  # Set a minimum coverage threshold for PRs
  status:
    project:
      default:
        target: 40%
        threshold: 0%
    patch:
      default:
        target: 60%

  # Ignore specific files or directories
  ignore:
    - "**/Generated/*"
    - "**/Migrations/*"
    - "tests/**"
    - "tools/**"
    - "**/obj/**"
    - "**/bin/**"
    - "**/*.g.cs"
    - "**/*.g.i.cs"
    - "**/*.designer.cs"
    # WPF XAML code-behind (*.xaml.cs) is intentionally NOT ignored: App/MainWindow/pages are exercised by the
    # UI tests and the STA unit tests in tests/GameControllerForZwift.UnitTests.

comment: false
