<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 489 299">
<title>PlayStation DualShock 4 controller diagram</title>
<desc>Flat drawing of a DualShock 4 (no bumpers or triggers). Interactive shapes use ControllerInput ids: A=Cross, B=Circle, X=Square, Y=Triangle, View=Share, Menu=Options, the D-pad arms, and the two thumbstick groups (the r30 and r22 rings move together; the r22 cap is L3/R3). Glyph strokes carry data-for with the input they mark. The touchpad is not interactive.</desc>
