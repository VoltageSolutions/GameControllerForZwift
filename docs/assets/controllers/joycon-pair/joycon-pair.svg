<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 474 342">
<title>Joy-Con pair (grip) controller diagram</title>
<desc>Flat drawing of a Joy-Con pair in the charging grip. Interactive shapes use ControllerInput ids: A (right), B (bottom), X (top), Y (left) on the right Joy-Con; the D-pad buttons (DPadUp, DPadRight, DPadDown, DPadLeft) on the left Joy-Con; View (minus), Menu (plus), the shoulder lips (LeftBumper, RightBumper; digital) and the two thumbstick groups (the stick and cap rings move together; the cap is L3/R3). Glyph strokes carry data-for with the input they mark. Home, Capture and the Switch logo are decorative.</desc>
