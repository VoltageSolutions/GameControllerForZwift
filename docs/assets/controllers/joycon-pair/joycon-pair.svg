.stick{fill:#e2e2e2;stroke:#555;stroke-width:1.35}
.cap{fill:#e2e2e2;stroke:#888;stroke-width:1.2}
.glyph{fill:none;stroke:#333;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round}
</style>
