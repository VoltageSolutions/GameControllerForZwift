/* preview only: platforms map these classes to theme tokens */
.ol{fill:none;stroke:#555;stroke-width:1.9;stroke-linejoin:round;stroke-linecap:round}
.body-fill{fill:#eee;stroke:none}
.key{fill:#e2e2e2;stroke:#555;stroke-width:1.35;stroke-linejoin:round}
.well{fill:#e2e2e2;stroke:#888;stroke-width:1.2}
.stick{fill:#e2e2e2;stroke:#555;stroke-width:1.35}
.cap{fill:#e2e2e2;stroke:#888;stroke-width:1.2}
.glyph{fill:none;stroke:#333;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round}
</style>
