<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 498 350">
<title>Xbox controller diagram</title>
<desc>Flat drawing of an Xbox controller (no bumpers or triggers). Interactive shapes use ControllerInput ids: A, B, X, Y, View, Menu, the D-pad arms, and the two thumbstick groups (the stick and cap rings move together; the cap is L3/R3). Glyph strokes carry data-for with the input they mark. The Xbox button is decorative and not interactive.</desc>
